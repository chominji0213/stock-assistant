<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>계좌분석 - 주식 분석 비서</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="site-title">
                <span class="logo-mark">📈</span>
                <span class="logo-text">주식 분석 비서</span>
            </a>
            <nav class="auth-nav">
                <div sec:authorize="isAuthenticated()">
                    <span sec:authentication="name">아이디</span>
                    <form action="/logout" method="post" class="logout-form">
                        <button type="submit" class="link-button">로그아웃</button>
                    </form>
                </div>
            </nav>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <h2>메뉴</h2>
            <ul>
                <li><a th:href="@{/general-chat}">일반질의</a></li>
                <li><a th:href="@{/account-analysis}" class="active">계좌분석</a></li>
            </ul>
        </aside>

        <section class="content">
            <div class="content-header">
                <h2>계좌분석</h2>
            </div>

            <div>
                <p th:if="${errorMessage}" class="field-hint hint-error" th:text="${errorMessage}"></p>

                <form action="/account-analysis" method="post" enctype="multipart/form-data">
                    <div class="dropzone">
                        <!-- <div class="dropzone-icon">🖼️</div> -->
                        <p>보유 종목이 보이는 계좌 캡처 이미지를 올려주세요</p>
                        <div class="file-upload" style="justify-content:center;">
                            <label class="btn-upload" for="image">이미지 선택</label>
                            <span class="file-name" id="imageFileName">선택된 파일 없음</span>
                        </div>
                        <input type="file" id="image" name="image" accept="image/*" hidden>
                    </div>
                    <button type="submit" class="btn-submit" id="analysisSubmitBtn" style="margin-top:16px;">
                        <span class="spinner" id="analysisSpinner" hidden></span>
                        <span id="analysisSubmitLabel">분석하기</span>
                    </button>
                </form>

                <div th:if="${confidenceScore != null}">
                    <div class="score-panel">
                        <div class="score-ring"><span th:text="${confidenceScore}"></span></div>
                        <div class="score-meta">
                            <span class="badge badge-success">신뢰 가능</span>
                            <div class="score-reason">인식 신뢰도 점수 (100점 만점)</div>
                        </div>
                    </div>

                    <div class="score-issue" th:if="${unmatchedStocks != null and !unmatchedStocks.isEmpty()}">
                        ⚠ Top20에 없어 일부 분석에서 제외된 종목: <span th:text="${#strings.listJoin(unmatchedStocks, ', ')}"></span>
                    </div>

                    <table class="holdings-table" th:if="${holdings != null and !holdings.isEmpty()}">
                        <tr>
                            <th>종목명</th>
                            <th>수량</th>
                            <th>평가금액</th>
                            <th>수익률(%)</th>
                        </tr>
                        <tr th:each="h : ${holdings}">
                            <td th:text="${h['stock_name']}"></td>
                            <td th:text="${h['quantity']}"></td>
                            <td th:text="${h['eval_amount']}"></td>
                            <td th:text="${h['profit_loss_rate']}"></td>
                        </tr>
                    </table>
                    <div class="empty-state" th:if="${holdings == null or holdings.isEmpty()}">인식된 종목이 없습니다.</div>

                    <div class="score-panel" th:if="${diagnosisScore != null}" style="margin-top:16px;">
                        <div class="score-ring"><span th:text="${diagnosisScore}"></span></div>
                        <div class="score-meta">
                            <div class="score-reason">계좌 진단 점수 (100점 만점)</div>
                            <ul style="margin:6px 0 0; padding-left:18px; font-size:13px; color:var(--text-soft);">
                                <li th:each="entry : ${scoreBreakdown}" th:text="${entry.key} + ': ' + ${entry.value} + '점'"></li>
                            </ul>
                        </div>
                    </div>

                    <div class="answer-card" th:if="${finalReport}">
                        <div class="answer-body">
                            <div class="answer-label">AI 분석 리포트</div>
                            <div class="answer-text" th:text="${finalReport}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
    (function () {
        var input = document.getElementById('image');
        var name = document.getElementById('imageFileName');
        input.addEventListener('change', function () {
            name.textContent = input.files[0] ? input.files[0].name : '선택된 파일 없음';
        });
    })();

    document.querySelector('.dropzone').closest('form').addEventListener('submit', function () {
        document.getElementById('analysisSpinner').classList.add('show');
        document.getElementById('analysisSubmitLabel').textContent = '분석 중...';
        document.getElementById('analysisSubmitBtn').disabled = true;
    });
    </script>
</body>
</html>
